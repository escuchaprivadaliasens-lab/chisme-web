<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CHISME — la red social donde el chisme se convierte en comunidad. Publica, comenta, reacciona y conecta.">
  <meta name="keywords" content="chisme, red social, comunidad, social network">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://escuchaprivadaliasens-lab.github.io/chisme-web/">

  <!-- Color de tema: tinta profundo "Nocturno Cálido" -->
  <meta name="theme-color" content="#141110">

  <!-- Open Graph / redes -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="CHISME — la red social del chisme">
  <meta property="og:description" content="Publica, comenta, reacciona y conecta en CHISME.">
  <meta property="og:url" content="https://escuchaprivadaliasens-lab.github.io/chisme-web/">
  <!-- og:image oficial (assets/brand/social/og-image-1200x630.png) -->
  <meta property="og:image" content="https://escuchaprivadaliasens-lab.github.io/chisme-web/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://escuchaprivadaliasens-lab.github.io/chisme-web/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CHISME">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CHISME — la red social del chisme</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--

</html>
